<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>DEFCON Survivors</title>
<style>
  :root { --bg:#0b0f0c; --panel:#121a14; --g:#38ff7a; --dim:#2a6b43; --red:#ff4545; --amber:#ffb020; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--g); font-family:"Courier New",monospace; display:flex; justify-content:center; padding:20px; }
  #app { width:100%; max-width:480px; }
  h1 { letter-spacing:4px; font-size:22px; margin:8px 0 4px; text-align:center; }
  .sub { text-align:center; color:var(--dim); margin-bottom:20px; font-size:13px; }
  .box { background:var(--panel); border:1px solid var(--dim); padding:16px; margin-bottom:16px; }
  .embsel { flex:1; min-width:0; padding:10px; background:#000; border:1px solid var(--g); color:var(--g); font:inherit; font-size:16px; }
  input[type=text] { width:100%; padding:12px; background:#000; border:1px solid var(--g); color:var(--g); font:inherit; font-size:18px; }
  button { width:100%; padding:14px; margin-top:10px; background:transparent; color:var(--g); border:2px solid var(--g); font:inherit; font-size:18px; letter-spacing:2px; cursor:pointer; }
  button:hover { background:var(--g); color:#000; }
  .card { border:2px solid var(--g); padding:20px; text-align:center; }
  .card.corrupt { border-color:var(--red); color:var(--red); }
  .role { font-size:26px; font-weight:bold; margin:6px 0 10px; }
  .tag { display:inline-block; padding:3px 10px; border:1px solid currentColor; font-size:13px; letter-spacing:2px; }
  .code { font-size:44px; letter-spacing:8px; margin:14px 0 4px; color:var(--amber); }
  .desc { font-size:14px; color:#9fdcb4; }
  .card.corrupt .desc { color:#ff9a9a; }
  .lbl { font-size:12px; color:var(--dim); letter-spacing:2px; }
  .names div { padding:4px 0; }
  #digits { width:100%; text-align:center; font-size:30px; letter-spacing:6px; }
  .status { text-align:center; font-size:22px; letter-spacing:3px; min-height:30px; margin-top:10px; }
  .ok { color:var(--g); } .bad { color:var(--red); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:5px 4px; border-bottom:1px solid var(--dim); }
  .err { color:var(--red); text-align:center; min-height:20px; }
  #chbtn { cursor:pointer; font-size:13px; letter-spacing:2px; border:1px solid var(--dim); padding:4px 8px; background:var(--panel); display:none; }
  #chbtn.on, #rolesbtn.on, #cardbtn.on { border-color:var(--g); background:#1b281f; }
  #chbtn b { color:#000; background:var(--amber); border-radius:10px; padding:0 7px; margin-left:6px; }
  #desk { position:fixed; inset:0; z-index:3; pointer-events:none; }
  .win { position:absolute; pointer-events:auto; width:min(340px,calc(100vw - 16px)); max-height:calc(100vh - var(--tb,96px) - 10px); background:var(--panel); border:2px solid var(--dim); display:flex; flex-direction:column; box-shadow:0 6px 24px #000a; }
  .win.front { border-color:var(--g); }
  .win.thr, .win.hub { height:min(400px,calc(100vh - var(--tb,96px) - 10px)); }
  .wtop { display:flex; justify-content:space-between; gap:8px; padding:8px 12px; border-bottom:1px solid var(--dim); letter-spacing:2px; font-size:13px; background:#16231a; cursor:move; user-select:none; touch-action:none; }
  .wx { cursor:pointer; }
  .wbody { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; }
  .win.thr .wbody { overflow:hidden; }
  .win button { width:auto; margin:0; padding:8px 14px; font-size:14px; }
  .win .card { border:none; }
  .pname { font-size:18px; color:var(--amber); margin:-4px 0 10px; }
  .tabs { display:flex; gap:8px; padding:8px 12px; }
  .tabs button { flex:1; } .tabs button.on { background:var(--g); color:#000; }
  .rows { overflow:auto; }
  .row { padding:10px 12px; border-bottom:1px solid var(--dim); cursor:pointer; display:flex; justify-content:space-between; }
  .row:hover { background:#1b281f; } .row small { color:var(--dim); } .dot { color:var(--amber); }
  .cmsgs { flex:1; min-height:0; overflow:auto; padding:10px 12px; }
  .m { margin:6px 0; max-width:85%; padding:6px 10px; border:1px solid var(--dim); font-size:15px; word-wrap:break-word; }
  .m i { display:block; font-size:11px; color:var(--dim); font-style:normal; }
  .m.me { margin-left:auto; border-color:var(--g); }
  .send { display:flex; gap:8px; padding:8px 12px; border-top:1px solid var(--dim); }
  .send input { flex:1; font-size:16px; padding:8px; }
  button:disabled { opacity:.35; cursor:not-allowed; } button:disabled:hover { background:transparent; color:var(--g); }
  button.tapready { border-color:var(--amber); color:var(--amber); animation:pulse 1.2s infinite; } button.tapready:hover { background:var(--amber); color:#000; }
  button.tapopt { font-size:14px; padding:10px; }
  @keyframes pulse { 50% { box-shadow:0 0 12px var(--amber); } }
  body { padding-top:var(--tb,96px); }
  #tools { order:2; width:100%; display:flex; gap:6px; }
  #rolesbtn, #cardbtn { cursor:pointer; font-size:13px; letter-spacing:2px; border:1px solid var(--dim); padding:4px 8px; background:var(--panel); }
  #comp { position:fixed; z-index:4; left:0; top:var(--tb,96px); bottom:0; width:min(320px,100vw); background:var(--panel); border:2px solid var(--g); display:none; flex-direction:column; }
  #comp.open { display:flex; }
  #comp .top { display:flex; justify-content:space-between; padding:8px 12px; border-bottom:1px solid var(--dim); letter-spacing:2px; } #comp .top span { cursor:pointer; }
  #comp .cbody { overflow:auto; padding:10px 12px; flex:1; }
  .crole { border:1px solid var(--dim); padding:8px 10px; margin:10px 0; } .crole.mine { border-color:var(--g); background:#16231a; }
  .crole .desc { margin:4px 0; }
  /* keep the game screen free: side panels on wide screens, bottom sheet with extra scroll room on narrow ones */
  @media (min-width:900px) { body.compopen { padding-left:340px; } }
  #topbar { position:fixed; top:0; left:0; right:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--dim); padding:6px 10px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px; }
  #tbl { display:flex; gap:6px; }
  #defcon { order:3; width:100%; display:none; justify-content:center; align-items:center; gap:8px; }
  .dlbl { letter-spacing:3px; font-size:13px; color:var(--dim); }
  .dl { width:34px; padding:4px 0; text-align:center; border:1px solid var(--dim); color:var(--dim); font-size:18px; }
  .dl.on { color:#000; font-weight:bold; box-shadow:0 0 12px currentColor; }
  .dl.d5.on { background:#e8e8e8; border-color:#e8e8e8; color:#000; } .dl.d4.on { background:#38ff7a; border-color:#38ff7a; }
  .dl.d3.on { background:#ffd020; border-color:#ffd020; } .dl.d2.on { background:#ff8c1a; border-color:#ff8c1a; } .dl.d1.on { background:#ff4545; border-color:#ff4545; }
  #readybtn { width:auto; margin:0; padding:6px 12px; font-size:14px; } #readybtn.isready { background:var(--g); color:#000; }
  /* ---- phone layout: fixed screen, role panel by default, chat list + chats as full-screen WhatsApp-style views ---- */
  .av { display:none; }
  .rm { flex:1; min-width:0; display:flex; flex-direction:column; } .rm small { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .rr { flex:none; }
  body.mob { padding:0; display:block; min-height:0; height:100dvh; overflow:hidden; }
  body.mob #app { position:fixed; left:0; right:0; top:var(--tb,96px); bottom:0; max-width:none; overflow:auto; padding:12px 12px 80px; }
  body.mob.hasdef #app > h1, body.mob.hasdef #app > .sub { display:none; }
  body.mob #topbar { padding:4px 8px; gap:4px; }
  body.mob #defcon { order:-1; flex-wrap:wrap; gap:4px; } body.mob .dl { width:28px; font-size:16px; }
  body.mob #tbl input[type=range] { width:56px !important; }
  body.mob #tools { order:2; width:auto; } body.mob #cardbtn { display:none !important; }
  body.mob #comp { width:100vw; }
  body.mob #chbtn { position:fixed; left:0; right:0; bottom:0; text-align:center; font-size:18px; padding:16px; border:none; border-top:2px solid var(--g); background:#16231a; }
  body.mob .win { left:0 !important; right:0; top:var(--tb,96px) !important; bottom:0; width:auto; height:auto !important; max-height:none; border:none; box-shadow:none; }
  body.mob .wtop { cursor:default; font-size:15px; padding:12px; align-items:center; }
  body.mob .wt { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:bold; }
  body.mob .wx { order:-1; font-size:0; } body.mob .wx::before { content:'\2039'; font-size:30px; line-height:20px; padding-right:6px; }
  body.mob .row { align-items:center; gap:12px; padding:12px; }
  body.mob .av { display:flex; width:42px; height:42px; flex:none; border-radius:50%; background:#1b3a27; border:1px solid var(--dim); align-items:center; justify-content:center; font-weight:bold; }
  body.mob .rm b { text-transform:uppercase; }
  body.mob .win.thr .cmsgs { background:#0e1510; }
  body.mob .m { border:none; border-radius:12px 12px 12px 2px; background:#1a2a20; max-width:80%; }
  body.mob .m.me { border-radius:12px 12px 2px 12px; background:#14502c; }
</style>
</head>

let ws, state = null, err = '';
let savedCode = '';
let savedName = localStorage.getItem('am_name') || '';

// ---- language (EN / IT) ----
let lang = localStorage.getItem('am_lang') || ((navigator.language || '').toLowerCase().startsWith('it') ? 'it' : 'en');
const TX = {

const t = (k, ...a) => { const v = TX[lang][k]; return typeof v === 'function' ? v(...a) : v; };
const rn = (r) => TX[lang].roles[r] || r;
const lab = (mode, x) => (mode === 'role' ? rn(x) : x); // role ids come from the server in English

// background music: original loop made by tools/make-soundtrack.js (public/soundtrack.wav); starts on the first click (browsers block autoplay)
const music = new Audio('/soundtrack.wav');
music.loop = true;
const vol = document.createElement('input');
vol.type = 'range'; vol.min = 0; vol.max = 100; vol.value = localStorage.getItem('am_vol') ?? 5;
vol.style.cssText = 'width:80px;padding:0;margin:0;accent-color:#38ff7a;cursor:pointer';
music.volume = vol.value / 200;
vol.oninput = () => { music.volume = vol.value / 200; localStorage.setItem('am_vol', vol.value); startMusic(); };
let muted = localStorage.getItem('am_muted') === '1';
music.muted = muted;
const startMusic = () => music.play().catch(() => {});
const barCss = 'cursor:pointer;font-size:13px;letter-spacing:2px;border:1px solid var(--dim);padding:4px 8px;background:var(--panel)';
const muteBtn = document.createElement('div');
muteBtn.style.cssText = barCss;
const langBtn = document.createElement('div');
langBtn.style.cssText = barCss;
const paintBar = () => { muteBtn.textContent = t('music', !muted); langBtn.textContent = lang === 'it' ? 'IT | en' : 'EN | it'; };
muteBtn.onclick = () => { muted = !muted; music.muted = muted; localStorage.setItem('am_muted', muted ? '1' : '0'); paintBar(); startMusic(); };
langBtn.onclick = () => {

function renderThreadWin(w) {

function renderChat() {

  if (!on) { Object.keys(wins).forEach((i) => { wins[i].el.remove(); delete wins[i]; }); deskOn = false; known.clear(); frontId = null; return; }
  if (!deskOn) { // match start: card and hub on the desk

$c('chbtn').onclick = () => { if (wins.hub) closeWin('hub'); else { openWin('hub', 'hub', initHub); renderChat(); } };
$c('cardbtn').onclick = () => { if (wins.card) closeWin('card'); else { openWin('card', 'cardwin', () => {}); renderChat(); } };
// sound effects (made in the browser, no files): data tick on an incoming chat message, alarm when DEFCON changes
let actx;
const ac = () => actx || (actx = new (window.AudioContext || window.webkitAudioContext)());
document.addEventListener('click', () => ac().resume()); // browsers only allow sound after a click
const incoming = (v) => (v && v.chats ? v.chats.reduce((n, x) => n + x.msgs.filter((m) => !m.mine).length, 0) : 0);
function sounds(prev, next) {
  if (!prev || prev.phase !== 'play' || next.phase !== 'play') return;
  if (next.defcon !== prev.defcon) alarm();
  else if (incoming(next) > incoming(prev)) eerie();
}
// "data tick": two quick muffled digital clicks, 0.12 s
function eerie() {
  const c = ac(), t0 = c.currentTime, f = c.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 1500; f.connect(c.destination);
  [[1800, 1700, 0], [2400, 2300, 0.07]].forEach(([f1, f2, d]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(f1, t0 + d); o.frequency.exponentialRampToValueAtTime(f2, t0 + d + 0.05);
    g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.05, t0 + d + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.05);
    o.connect(g); g.connect(f); o.start(t0 + d); o.stop(t0 + d + 0.07);
  });
  setTimeout(() => f.disconnect(), 500);
}
function alarm() {
  const c = ac(), t0 = c.currentTime, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
  o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 1800;
  for (let i = 0; i < 8; i++) o.frequency.setValueAtTime(i % 2 ? 520 : 680, t0 + i * 0.25); // two-tone klaxon, 2 s
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.05);
  g.gain.setValueAtTime(0.18, t0 + 1.9); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2);
  o.connect(f); f.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + 2.05);
}
// DEFCON countdown (5 minutes per level), ticks locally between server updates
let defEnd = 0;
function paintTimer() {
  const el = document.getElementById('dtimer'); if (!el) return;
  const s = Math.max(0, Math.ceil((state.paused ? state.defconLeft : defEnd - Date.now()) / 1000)); // frozen while paused
  el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + (state.paused ? ' ' + t('paused') : '');
  el.style.color = s <= 60 ? '#ff4040' : '';
}
setInterval(paintTimer, 1000);
// DEFCON strip + READY button (top of the screen, only during play)
